# Copy this file to secrets.yaml in this same directory and fill it in.
# secrets.yaml is gitignored and must never be committed.
# See docs/esphome.md for the setup steps.

# Your 2.4 GHz WiFi network (the ESP32-C3 has no 5 GHz radio).
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# Home Assistant API encryption key. Generate one with:
#   openssl rand -base64 32
# The placeholder below is not a valid key on purpose: ESPHome will
# refuse it until you replace it with a generated one.
api_key: "REPLACE_WITH_GENERATED_KEY"

# Over-the-air update password. Pick a password of your own; it is
# only used when flashing updates over WiFi.
ota_password: "REPLACE_WITH_A_PASSWORD"
