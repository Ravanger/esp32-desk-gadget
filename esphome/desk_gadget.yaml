# ESP32 Desk Gadget — ESPHome firmware (default; firmware/desk_gadget.ino
# is the standalone Arduino backup)
#
# Same hardware, same wiring, same four screens as the Arduino sketch:
# Clock, Indoor (DHT11), Outdoor (weather), Summary. The difference is
# where the data goes and where the outdoor weather comes from:
#
# - Indoor temperature/humidity, WiFi signal, and uptime are published
#   to Home Assistant over the native ESPHome API (no MQTT broker).
# - Outdoor weather is imported FROM Home Assistant (a weather entity
#   you already have), instead of fetched from Open-Meteo on the
#   device. Use the Arduino sketch instead for a standalone gadget
#   with no Home Assistant dependency.
#
# Pins are the frozen SuperMini assignment from AGENTS.md and the
# sketch. Do not renumber them here without changing the sketch,
# docs/wiring.md, and scripts/check.py together:
#   OLED SDA 4 / SCL 5, DHT11 3, button 10 (encoder SW 10),
#   encoder CLK 6 / DT 7, pot wiper 1 (ADC1), PIR OUT 0.
#
# First flash over USB (the ESPHome dashboard or `esphome run`), then
# updates go over the air. Secrets live in esphome/secrets.yaml, which
# is gitignored and never committed; copy secrets.example.yaml to
# secrets.yaml and fill it in first.

substitutions:
  name: "desk-gadget"
  friendly_name: "Desk Gadget"
  # Labelled example, same as the sketch. Replace with the target
  # location before use.
  timezone: "America/Toronto"
  location_name: "TORONTO"
  # Your Home Assistant weather entity, e.g. weather.home. It must
  # expose temperature, humidity, and wind_speed attributes.
  weather_entity: "weather.home"
  # Navigation input. "false" = push button on GPIO 10 (default, one
  # press steps to the next page). "true" = rotary encoder on
  # CLK 6 / DT 7 / SW 10 (rotate steps both ways, press jumps to
  # Summary and back to Clock). Changing this needs a recompile,
  # exactly like USE_ENCODER in the sketch.
  use_encoder: "false"
  # "false" = no PIR wired (default). "true" = PIR on GPIO 0 blanks
  # the display 60 s after the room goes quiet. Changing this needs
  # a recompile, exactly like USE_PIR in the sketch.
  use_pir: "false"
  # WiFi transmit power. "20dB" is the default. If the board fails to
  # join WiFi (a known SuperMini antenna weakness), try "8.5dB" —
  # the ESPHome equivalent of WIFI_LOW_TX_POWER in the sketch.
  wifi_tx_power: "20dB"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Stable entity names in Home Assistant (no MAC suffix appended).
  name_add_mac_suffix: false
  # The release this YAML is compiled and checked against (OTA
  # encryption needs a recent release).
  min_version: 2026.10.0
  # Like the sketch's setup(): with a PIR, the display blanks 60 s
  # after boot unless motion or a press arrives first.
  on_boot:
    - lambda: |-
        if (${use_pir}) {
          id(pir_blank).execute();
        }

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# The SuperMini has no USB serial chip; logging goes over native USB,
# the same link the sketch uses with USB CDC On Boot.
logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: USB_CDC

# 2.4 GHz only: the ESP32-C3 has no 5 GHz radio.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: ${wifi_tx_power}
  # 0s disables ESPHome's default reboot after 15 min without WiFi, and
  # there is no access-point fallback: with WiFi down the gadget keeps
  # displaying, the way the sketch continues after its 30 s timeout.
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_key
  # 0s disables the API-disconnect reboot, so the gadget keeps running
  # and displaying when Home Assistant is down, like the sketch keeps
  # running when WiFi is down.
  reboot_timeout: 0s

# OTA updates use the same encryption key as the API (no key here
# means "inherit api_key"), so there is no separate OTA password.
ota:
  - platform: esphome
    encryption: {}

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - pool.ntp.org
      - time.nist.gov

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

# Roboto Mono, the closest match to the sketch's fixed-width text.
# Sizes mirror the sketch: 8 px (size 1), 16 px (size 2), 24 px (size 3).
# Text is drawn on its baseline at the sketch's y + 7 px per size step,
# where Adafruit GFX puts its baseline. Top-left anchoring would push
# Roboto Mono's taller ascender about 3 px lower and into the page dots.
font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 8
  - file: "gfonts://Roboto Mono"
    id: font_medium
    size: 16
  - file: "gfonts://Roboto Mono"
    id: font_large
    size: 24

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    # 78% is 200/255, the sketch's starting contrast. The pot corrects
    # it on its first read (within 50 ms).
    contrast: 78%
    # The sketch redraws once a second for the clock's seconds.
    update_interval: 1s
    lambda: |-
      const auto BL = TextAlign::BASELINE_LEFT;
      auto t = id(sntp_time).now();
      bool have_time = t.is_valid();
      int page = id(page_number);
      auto draw_header = [&](const char *title) {
        it.print(0, 7, id(font_small), BL, title);
        it.line(0, 11, 127, 11, COLOR_ON);
      };
      if (page == 0) {
        // ---- CLOCK ----
        draw_header("CLOCK");
        if (have_time) {
          it.strftime(10, 41, id(font_large), BL, "%H:%M", t);
          it.strftime(100, 41, id(font_small), BL, ":%S", t);
          it.strftime(0, 59, id(font_small), BL, "%a %d %b %Y", t);
        } else {
          it.print(10, 41, id(font_large), BL, "--:--");
        }
      } else if (page == 1) {
        // ---- INDOOR ----
        draw_header("INDOOR - DHT11");
        if (id(in_temp).has_state()) {
          it.printf(0, 32, id(font_medium), BL, "%.1f C", id(in_temp).state);
        } else {
          it.print(0, 32, id(font_medium), BL, "No reading");
        }
        if (id(in_hum).has_state()) {
          it.printf(0, 56, id(font_medium), BL, "%.0f %% RH", id(in_hum).state);
        }
      } else if (page == 2) {
        // ---- OUTDOOR ----
        // "HA" names the source honestly (Home Assistant, not Open-Meteo);
        // the full name would clip an 8-character location_name.
        it.printf(0, 7, id(font_small), BL, "%s - HA", "${location_name}");
        it.line(0, 11, 127, 11, COLOR_ON);
        if (!id(out_temp).has_state()) {
          it.print(0, 23, id(font_small), BL, "Waiting for first fetch...");
        } else {
          const char *t_unit = (id(out_temp_unit).has_state() &&
                                id(out_temp_unit).state.find('F') != std::string::npos) ? "F" : "C";
          if (id(out_hum).has_state()) {
            it.printf(0, 23, id(font_small), BL, "%.1f %s  %.0f %% RH", id(out_temp).state, t_unit, id(out_hum).state);
          } else {
            it.printf(0, 23, id(font_small), BL, "%.1f %s", id(out_temp).state, t_unit);
          }
          // Home Assistant condition strings are not WMO codes and carry no
          // intensity, so the labels do not claim one. Anything unmapped
          // shows as-is, so a new condition is never silently hidden.
          std::string cond = "-";
          if (id(out_condition).has_state()) {
            std::string raw = id(out_condition).state;
            if (raw == "sunny" || raw == "clear-night") cond = "Clear sky";
            else if (raw == "partlycloudy") cond = "Partly cloudy";
            else if (raw == "cloudy") cond = "Overcast";
            else if (raw == "fog") cond = "Fog";
            else if (raw == "hail") cond = "Hail";
            else if (raw == "lightning") cond = "Thunderstorm";
            else if (raw == "lightning-rainy") cond = "Thunderstorm, rain";
            else if (raw == "pouring") cond = "Heavy rain";
            else if (raw == "rainy") cond = "Rain";
            else if (raw == "snowy") cond = "Snow";
            else if (raw == "snowy-rainy") cond = "Rain and snow";
            else if (raw == "windy" || raw == "windy-variant") cond = "Windy";
            else if (raw == "exceptional") cond = "Exceptional";
            else cond = raw;
          }
          it.print(0, 35, id(font_small), BL, cond.c_str());
          if (id(out_wind).has_state()) {
            std::string w_unit = (id(out_wind_unit).has_state() && !id(out_wind_unit).state.empty())
                                     ? id(out_wind_unit).state : "km/h";
            it.printf(0, 53, id(font_small), BL, "Wind %.0f %s", id(out_wind).state, w_unit.c_str());
          } else {
            it.print(0, 53, id(font_small), BL, "Wind --");
          }
          unsigned long mins = (millis() - id(weather_updated_ms)) / 60000UL;
          it.printf(0, 61, id(font_small), BL, "Updated %lu min ago", mins);
        }
      } else {
        // ---- SUMMARY ----
        draw_header("SUMMARY");
        if (have_time) {
          it.strftime(0, 20, id(font_small), BL, "Time %H:%M", t);
        } else {
          it.print(0, 20, id(font_small), BL, "Time --:--");
        }
        if (id(in_temp).has_state() && id(in_hum).has_state()) {
          it.printf(0, 28, id(font_small), BL, "In %.1f C  %.0f %%", id(in_temp).state, id(in_hum).state);
        } else {
          it.print(0, 28, id(font_small), BL, "In --");
        }
        if (!id(out_temp).has_state()) {
          it.print(0, 36, id(font_small), BL, "Out --");
        } else {
          const char *t_unit = (id(out_temp_unit).has_state() &&
                                id(out_temp_unit).state.find('F') != std::string::npos) ? "F" : "C";
          if (id(out_hum).has_state()) {
            it.printf(0, 36, id(font_small), BL, "Out %.1f %s  %.0f %%", id(out_temp).state, t_unit, id(out_hum).state);
          } else {
            it.printf(0, 36, id(font_small), BL, "Out %.1f %s", id(out_temp).state, t_unit);
          }
        }
        it.printf(0, 44, id(font_small), BL, "Bright %d / 255", id(contrast_255));
        // ESPHome's own WiFi state, not the Arduino WiFi global (which
        // is not visible in ESPHome lambdas).
        it.printf(0, 52, id(font_small), BL, "WiFi %s", esphome::wifi::global_wifi_component->is_connected() ? "connected" : "DOWN");
        it.printf(0, 60, id(font_small), BL, "Up %lu min", millis() / 60000UL);
      }
      // Page dots, same positions as the sketch.
      for (int i = 0; i < 4; ++i) {
        it.filled_rectangle(52 + i * 8, 61, 5, 2, i == page ? COLOR_ON : COLOR_OFF);
      }

globals:
  # 0 clock, 1 indoor, 2 outdoor, 3 summary. Not restored: like the
  # sketch, the gadget always boots to the clock page.
  - id: page_number
    type: int
    restore_value: no
    initial_value: '0'
  # Current OLED contrast, 0-255, for the Summary page. Starts at the
  # sketch's starting value; the pot corrects it on its first read.
  - id: contrast_255
    type: int
    restore_value: no
    initial_value: '200'
  # millis() of the last outdoor update from Home Assistant, for the
  # Outdoor page's "Updated N min ago" line.
  - id: weather_updated_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

script:
  # The sketch's PIR rule: any motion, button press, or encoder step
  # restarts a 60 s timer, and the display blanks when it runs out
  # while the PIR output is LOW. Only used with use_pir true.
  - id: pir_blank
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          if (!id(pir_sensor).state) {
            id(oled).turn_off();
          }
  - id: user_activity
    then:
      - lambda: |-
          if (${use_pir}) {
            id(oled).turn_on();
            id(pir_blank).execute();
          }

binary_sensor:
  # Nav button to GND, INPUT_PULLUP, pressed = LOW. The 30 ms
  # delayed_on_off filter stands in for the sketch's debounce (a press
  # counts only if the line was HIGH for at least 30 ms): bounce under
  # 30 ms is ignored, at the cost of a 30 ms delay on each press.
  # With use_encoder true, this same pin is the encoder's SW pin.
  - platform: gpio
    name: "Desk Gadget Button"
    id: nav_button
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_press:
      - script.execute: user_activity
      - lambda: |-
          if (${use_encoder}) {
            id(page_number) = (id(page_number) == 3) ? 0 : 3;
          } else {
            id(page_number) = (id(page_number) + 1) % 4;
          }
      - component.update: oled
  # PIR OUT, INPUT_PULLDOWN like the sketch. No filter, so the Home
  # Assistant motion entity follows the PIR output directly (plus the
  # module's own delay-pot time); the 60 s blanking is pir_blank above.
  # With use_pir false, the display actions below are compiled out.
  - platform: gpio
    name: "Desk Gadget Motion"
    id: pir_sensor
    device_class: motion
    pin:
      number: GPIO0
      mode:
        input: true
        pulldown: true
    on_press:
      - lambda: |-
          if (${use_pir}) {
            id(oled).turn_on();
            id(pir_blank).stop();
          }
    on_release:
      - lambda: |-
          if (${use_pir}) {
            id(pir_blank).execute();
          }

sensor:
  # DHT11, same 2.5 s interval as the sketch. ESPHome's DHT component
  # publishes NaN on a failed read; filter_out drops it, so the display
  # and Home Assistant keep the last good value, as the sketch does.
  # The moving average (last 5 good reads, ~12.5 s) matches the sketch's
  # DHT_AVG_N and smooths the DHT11's whole-degree / whole-percent flicker.
  # DHT11 limits are +/-2 C / +/-5% RH: a rough room sensor, not a
  # precision instrument.
  - platform: dht
    pin: GPIO3
    model: DHT11
    update_interval: 2.5s
    temperature:
      name: "Desk Gadget Indoor Temperature"
      id: in_temp
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    humidity:
      name: "Desk Gadget Indoor Humidity"
      id: in_hum
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"
      accuracy_decimals: 0
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
  # Potentiometer wiper, same 50 ms poll as the sketch. Internal: it
  # drives the display only, it is not a Home Assistant entity.
  # The C3 ADC tops out around 2.5 V at 12 dB attenuation (ESPHome's
  # name for the 11 dB setting the sketch uses), so the top roughly
  # 24% of pot travel reads full brightness — expected, not a fault,
  # and the same clamp the sketch applies.
  - platform: adc
    pin: GPIO1
    attenuation: 12db
    update_interval: 50ms
    name: "Desk Gadget Potentiometer"
    id: pot_adc
    internal: true
    accuracy_decimals: 3
    on_value:
      - lambda: |-
          float mv = x * 1000.0f;
          if (mv < 0.0f) mv = 0.0f;
          if (mv > 2500.0f) mv = 2500.0f;
          int target = (int) (8 + (mv / 2500.0f) * 247.0f);
          if (abs(target - id(contrast_255)) > 4) {
            id(contrast_255) = target;
            id(oled).set_contrast(target / 255.0f);
          }
  # Rotary encoder, CLK 6 / DT 7, INPUT_PULLUP like the sketch. The
  # sensor is always instantiated, but with use_encoder false its
  # actions are compiled out and the unwired pins sit pulled high,
  # so it cannot step pages on its own. Internal: page changes are
  # shown on the display, the raw step count is not a sensor.
  # If the encoder double-steps, try resolution 2 (see docs/esphome.md).
  - platform: rotary_encoder
    name: "Desk Gadget Encoder"
    id: encoder
    internal: true
    pin_a:
      number: GPIO6
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO7
      mode:
        input: true
        pullup: true
    resolution: 1
    on_clockwise:
      - lambda: |-
          if (${use_encoder}) {
            id(user_activity).execute();
            id(page_number) = (id(page_number) + 1) % 4;
          }
      - component.update: oled
    on_anticlockwise:
      - lambda: |-
          if (${use_encoder}) {
            id(user_activity).execute();
            id(page_number) = (id(page_number) + 3) % 4;
          }
      - component.update: oled
  # Home Assistant entities for automations. The Summary page's WiFi
  # line uses the WiFi component's own connected state, and uptime
  # uses millis(), like the sketch uses WiFi.status() and millis().
  - platform: wifi_signal
    name: "Desk Gadget WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s
  - platform: uptime
    name: "Desk Gadget Uptime"
    id: uptime_sensor
  # Outdoor weather imported from Home Assistant. These sensors are
  # internal (not re-exported back to Home Assistant). Values arrive in
  # the weather entity's own units; the display takes those units from
  # the temperature_unit and wind_speed_unit attributes below, so an
  # imperial Home Assistant shows F and mph. A value Home Assistant
  # cannot parse (for example an unavailable entity) arrives as NaN and
  # is dropped, so the last good values stay on screen.
  - platform: homeassistant
    name: "Desk Gadget Outdoor Temperature"
    id: out_temp
    entity_id: ${weather_entity}
    attribute: temperature
    accuracy_decimals: 1
    internal: true
    filters:
      - filter_out: nan
    on_value:
      - lambda: |-
          id(weather_updated_ms) = millis();
  - platform: homeassistant
    name: "Desk Gadget Outdoor Humidity"
    id: out_hum
    entity_id: ${weather_entity}
    attribute: humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0
    internal: true
    filters:
      - filter_out: nan
  - platform: homeassistant
    name: "Desk Gadget Outdoor Wind Speed"
    id: out_wind
    entity_id: ${weather_entity}
    attribute: wind_speed
    accuracy_decimals: 0
    internal: true
    filters:
      - filter_out: nan

text_sensor:
  # The weather entity's state is its condition string (sunny,
  # partlycloudy, rainy, ...). Mapped to display labels in the
  # display lambda. Internal: not re-exported to Home Assistant.
  - platform: homeassistant
    name: "Desk Gadget Outdoor Condition"
    id: out_condition
    entity_id: ${weather_entity}
    internal: true
  - platform: homeassistant
    name: "Desk Gadget Outdoor Temperature Unit"
    id: out_temp_unit
    entity_id: ${weather_entity}
    attribute: temperature_unit
    internal: true
  - platform: homeassistant
    name: "Desk Gadget Outdoor Wind Unit"
    id: out_wind_unit
    entity_id: ${weather_entity}
    attribute: wind_speed_unit
    internal: true
